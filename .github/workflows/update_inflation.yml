name: Update Bolivian Inflation Data

on:
  schedule:
    # Run twice a month on the 5th and 10th at 12:00 UTC to capture release window
    - cron: '0 12 5,10 * *'
  workflow_dispatch: # Enable manual execution from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data pipeline
        run: python clean_inflation_data.py

      - name: Check for new data and commit
        run: |
          # Configure Git using the standard GitHub Actions bot credentials
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if there are any modifications, deletions, or untracked CSVs in the data directory
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No new data detected"
            exit 0
          else
            echo "New data detected! Committing changes..."
            git add data/*.csv
            git commit -m "Auto-update Bolivian CPI inflation datasets [skip ci]"
            git push
          fi
